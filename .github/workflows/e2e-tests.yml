name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *' # Daily at midnight UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  e2e-tests:
    name: E2E Tests on ${{ matrix.browser }} (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # 406 tests per project. At the observed ~14s per test with 4 workers, plus a
    # retry on each of the ~200 failures, chromium and mobile ran past the
    # 60-minute wall and were CANCELLED — which yields no results at all, not
    # even a list of what failed. Two shards halves each job's work so every
    # browser reports, and a red job you can read beats a cancelled one you
    # cannot.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run E2E tests
        run: npm run test:e2e:${{ matrix.browser }} -- --shard=${{ matrix.shard }}/2
        env:
          CI: true

      # Artifact names must carry the shard: uploads do not overwrite by
      # default, so two shards writing one name fails the upload.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  mobile-tests:
    name: Mobile E2E Tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # test:e2e:mobile runs two projects, so it carries twice the work of a single
    # browser job — it was cancelled at the 60-minute wall for the same reason.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # test:e2e:mobile runs "Mobile Chrome" AND "Mobile Safari". Mobile Safari
      # is a webkit device, so installing chromium alone left every Mobile Safari
      # test failing on a missing browser.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run Mobile E2E tests
        run: npm run test:e2e:mobile -- --shard=${{ matrix.shard }}/2
        env:
          CI: true

      - name: Upload mobile test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mobile-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 14

  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # --project=chromium is required, not cosmetic: without it Playwright runs
      # the spec against all five configured projects while this job installs
      # only chromium, so every firefox, webkit and Mobile Safari test fails on a
      # missing browser and the job can never be green.
      - name: Run accessibility tests
        run: npx playwright test e2e/accessibility.spec.js --project=chromium
        env:
          CI: true

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-report
          path: playwright-report/
          retention-days: 30

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Same missing --project as the accessibility job — see the note there.
      - name: Run visual regression tests
        run: npx playwright test e2e/visual.spec.js --project=chromium
        env:
          CI: true
        continue-on-error: true # Visual tests may fail on first run

      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Same missing --project as the accessibility job — see the note there.
      # This job reported "32 passed" alongside ~150 browser-not-installed
      # failures, which is what a missing --project looks like in the summary.
      - name: Run performance tests
        run: npx playwright test e2e/performance.spec.js --project=chromium
        env:
          CI: true

      - name: Upload performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-metrics
          path: test-results/
          retention-days: 30

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [e2e-tests, mobile-tests, accessibility-tests, visual-regression, performance-tests]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create summary
        run: |
          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Browser Tests: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Mobile Tests: ${{ needs.mobile-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Accessibility: ${{ needs.accessibility-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Visual Regression: ${{ needs.visual-regression.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Performance: ${{ needs.performance-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Test reports and screenshots have been uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
