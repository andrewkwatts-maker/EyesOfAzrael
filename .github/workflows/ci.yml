name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint js/ --max-warnings 0 || echo "Lint warnings found"

      - name: Check for debugger statements
        run: |
          # Match actual `debugger` statements, not the word in comments/filenames
          if grep -rnE '^[[:space:]]*debugger[[:space:]]*;?[[:space:]]*$' js/ --include="*.js"; then
            echo "ERROR: debugger statements found in production code"
            exit 1
          fi

      # css/bundle.css is committed, because GitHub Pages serves the repo as-is
      # and there is no build step in front of it. That makes a stale bundle
      # invisible: the source stylesheet changes, the site keeps shipping the old
      # CSS, and nothing fails. This is the thing that fails.
      - name: Check CSS bundle is up to date
        run: npm run build:css:check

      - name: Run unit tests with coverage
        run: npm run test:ci

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate project integrity
        run: node scripts/validate-project-integrity.js || echo "Validation script not found"
